
<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(120deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 30px;
            width: 320px;
            border-radius: 12px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border-radius: 5px;
        }
        input { border: 1px solid #ccc; }
        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
        }
        a { color: #667eea; }
        .msg { color: red; }
    </style>
</head>
<body>
<div class="box">
    <h2>Login</h2>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p class="msg">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <input type="text" name="username"
               placeholder="Username" required>

        <input type="password" name="password"
               placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <p>New user? <a href="/register">Register</a></p>
</div>
</body>
</html>
