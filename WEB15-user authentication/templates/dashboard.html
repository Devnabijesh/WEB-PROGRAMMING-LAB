
<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #eef0ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 20px #ccc;
        }
        a {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="box">
    <h2>Welcome, {{ username }}!</h2>
    <p>You have successfully logged in.</p>
    <a href="/logout">Logout</a>
</div>
</body>
</html>
