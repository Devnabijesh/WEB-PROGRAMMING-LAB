
<!DOCTYPE html>
<html>
<head>
    <title>Edit Employee</title>
    <style>
        body {
            font-family: Arial;
            background: #eef0ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #ccc;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #5544aa;
            color: white;
            border: none;
            cursor: pointer;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>
<div class="container">

    <h2>Edit Employee</h2>

    <form method="POST">
        <input type="text" name="name"
               value="{{ employee[1] }}" required>

        <input type="email" name="email"
               value="{{ employee[2] }}" required>

        <input type="text" name="department"
               value="{{ employee[3] }}" required>

        <input type="number" name="salary"
               value="{{ employee[4] }}" min="0" step="0.01" required>

        <button type="submit">Update Employee</button>
    </form>

    <a href="/">Back to Home</a>

</div>
</body>
</html>
