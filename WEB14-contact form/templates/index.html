
<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #333;
        }

        h2 {
            text-align: center;
            color: #5b4b9a;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #764ba2;
        }

        .success {
            color: green;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Contact Us</h2>

        {% if success %}
            <p class="success">{{ success }}</p>
        {% endif %}

        <form method="POST">

            <input type="text" name="name"
                   placeholder="Enter your name" required>

            <input type="email" name="email"
                   placeholder="Enter your email" required>

            <textarea name="message"
                      placeholder="Enter your message"
                      required></textarea>

            <button type="submit">Send Message</button>

        </form>

    </div>

</body>
</html>
