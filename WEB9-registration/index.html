
<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Registration Form</h2>

<form id="registerForm">
    <input type="text" id="name" placeholder="Enter Name">
    <span id="nameError"></span><br><br>

    <input type="text" id="email" placeholder="Enter Email">
    <span id="emailError"></span><br><br>

    <input type="password" id="password" placeholder="Enter Password">
    <span id="passwordError"></span><br><br>

    <button type="submit">Register</button>
</form>

<h2>Login Form</h2>

<form id="loginForm">
    <input type="text" id="loginEmail" placeholder="Enter Email">
    <span id="loginEmailError"></span><br><br>

    <input type="password" id="loginPassword" placeholder="Enter Password">
    <span id="loginPasswordError"></span><br><br>

    <button type="submit">Login</button>
</form>

<script src="script.js"></script>
</body>
</html>
